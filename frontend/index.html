<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>PawnManager – Pawn Shop Management Software</title>
    <meta
      name="description"
      content="PawnManager is offline-first pawn shop management software with POS, inventory and billing for modern pawn shops."
    />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/svg+xml" href="public/logo.svg" />
    <link rel="canonical" href="https://www.pawnmanager.com/" />

    <!-- Global structured data: SoftwareApplication -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "PawnManager",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web, Android, iOS",
        "url": "https://www.pawnmanager.com/",
        "description": "Offline-first pawn shop management software with POS, inventory, billing and loan tracking for pawn shops in India.",
        "offers": {
          "@type": "Offer",
          "priceCurrency": "INR",
          "price": "0.00",
          "description": "Flexible free and paid plans for pawn shops."
        },
        "publisher": {
          "@type": "Organization",
          "name": "PawnManager"
        }
      }
    </script>

    <!-- Global structured data: Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "PawnManager",
        "url": "https://www.pawnmanager.com/",
        "logo": "https://www.pawnmanager.com/logo.png",
        "description": "PawnManager provides modern pawn shop management software for inventory, billing and loan tracking.",
        "sameAs": []
      }
    </script>
    <link rel="stylesheet" href="/src/index.css">
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 1.5rem; max-width: 48rem; margin: 0 auto; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
        <h1 style="font-size: 1.75rem; line-height: 2.25rem; font-weight: 700; margin-bottom: 0.75rem;">
          PawnManager – Pawn Shop Management Software & POS
        </h1>
        <p style="margin-bottom: 0.75rem;">
          PawnManager is a cloud-based pawn shop management system that helps Indian pawn shops track inventory, customer records, pawn tickets and repayments in one secure dashboard.
        </p>
        <p>
          Replace manual registers and Excel sheets with a simple pawn shop POS that automates billing, interest calculations and reminders so you can focus on running your shop.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
